    <title>Сделка онлайн</title>
    <!-- Installs to the home screen of a phone like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F6B5A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Сделка" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>

    <noscript>Чтобы открыть приложение, включите JavaScript в браузере.</noscript>
