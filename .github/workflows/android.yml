# Builds the Android app (APK) on GitHub's servers and publishes it on the "android-test" release page:
# https://github.com/ivan20200828-a11y/-/releases/tag/android-test
# Runs on every push to main that touches the app, or by hand (Actions → Android APK → Run workflow).
#
# Signing: without secrets the APK is signed with the standard test key, so a new test build installs over the old one.
# For the store, add repository secrets ANDROID_KEYSTORE (base64 of the .jks file), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; the APK is then signed with that key instead.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'app.json', 'app.config.js', 'package.json', 'package-lock.json', '.github/workflows/android.yml']

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Empty: the phone asks for the server address on the home screen («Адрес сервера»).
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild -p android --no-install

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Sign with the release key, if one is set up
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$APK"
            rm release.jks
          fi
          cp "$APK" sdelka-online.apk
          ls -l sdelka-online.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sdelka-online-apk
          path: sdelka-online.apk
          retention-days: 14

  # Starts the new APK on an Android emulator against a test server, steps through the first screens and publishes
  # the APK only when it works. The screenshots go to the release page next to it.
  check:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: sdelka-online-apk

      - name: Start the test server
        working-directory: server
        run: |
          npm ci --omit=dev --no-audit --no-fund
          (BACKUP_DIR=off DB_FILE=/tmp/check.db node --no-warnings=ExperimentalWarning src/main.ts > /tmp/server.log 2>&1 &)
          sleep 5
          curl -sf http://localhost:3000/api/health

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: sh scripts/android-check.sh; status=$?; adb logcat -d -v time > check/log.txt; exit $status

      - name: Show the app's errors
        if: always()
        run: grep -E 'FATAL|AndroidRuntime|E/ReactNativeJS' check/log.txt | head -60 || true

      - name: Publish the APK on the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Сборка для Android от $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК, версия кода ${GITHUB_SHA::7}. Проверена на эмуляторе Android 14: запуск, подключение к серверу, вход менеджера, список сделок.
          Скачайте sdelka-online.apk на телефон и откройте. Android попросит разрешить установку из этого источника.
          При первом запуске нажмите «Подключить по QR-коду» и наведите камеру на код в окне сервера."
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "Сделка онлайн для Android" --notes "$NOTES"
          gh release upload android-test sdelka-online.apk check/1-first-start.png check/2-connected.png check/3-manager-login.png check/4-deals.png --clobber
          gh release edit android-test --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check
          path: check/
          retention-days: 14
